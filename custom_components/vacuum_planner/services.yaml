enqueue:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: vacuum_planner
    rooms:
      required: true
      example: '[1, "Flur"]'
      selector:
        text:
          multiple: true
    mode:
      selector:
        select:
          translation_key: mode
          options:
          - vacuum
          - vacuum_mop
          - mop
          - mopping_after_sweeping
    front:
      default: false
      selector:
        boolean: null
dequeue:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: vacuum_planner
    rooms:
      required: true
      example: '[1, "Flur"]'
      selector:
        text:
          multiple: true
    skip_today:
      default: true
      selector:
        boolean: null
move:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: vacuum_planner
    room:
      required: true
      example: Kitchen
      selector:
        text: null
    position:
      required: true
      default: 0
      selector:
        number:
          min: 0
          max: 30
          mode: box
clear_queue:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: vacuum_planner
enqueue_due:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: vacuum_planner
start:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: vacuum_planner
    force:
      default: true
      selector:
        boolean: null
stop:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: vacuum_planner
    return_home:
      default: true
      selector:
        boolean: null
clean_now:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: vacuum_planner
    rooms:
      required: true
      example: '[1, "Flur"]'
      selector:
        text:
          multiple: true
    mode:
      default: vacuum_mop
      selector:
        select:
          translation_key: mode
          options:
          - vacuum
          - vacuum_mop
          - mop
          - mopping_after_sweeping
pause_room:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: vacuum_planner
    rooms:
      required: true
      example: '[1, "Flur"]'
      selector:
        text:
          multiple: true
    until:
      selector:
        datetime: null
    days:
      selector:
        number:
          min: 1
          max: 60
          mode: box
resume_room:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: vacuum_planner
    rooms:
      required: true
      example: '[1, "Flur"]'
      selector:
        text:
          multiple: true
set_plan:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: vacuum_planner
    room:
      required: true
      example: Kitchen
      selector:
        text: null
    mode:
      selector:
        select:
          translation_key: plan_mode
          options:
          - 'off'
          - vacuum
          - vacuum_mop
          - mop
          - mopping_after_sweeping
    interval:
      selector:
        number:
          min: 1
          max: 30
          unit_of_measurement: d
          mode: box
set_last_cleaned:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: vacuum_planner
    rooms:
      required: true
      example: '[1, "Flur"]'
      selector:
        text:
          multiple: true
    timestamp:
      selector:
        datetime: null
skip_today:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: vacuum_planner
    skip:
      default: true
      selector:
        boolean: null
