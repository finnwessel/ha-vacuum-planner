.entry: &entry
  config_entry_id:
    selector:
      config_entry:
        integration: vacuum_planner

.rooms: &rooms
  required: true
  example: "[1, \"Flur\"]"
  selector:
    text:
      multiple: true

.room: &room
  required: true
  example: "Kitchen"
  selector:
    text:

.mode: &mode
  selector:
    select:
      translation_key: mode
      options:
        - vacuum
        - vacuum_mop
        - mop
        - mopping_after_sweeping

enqueue:
  fields:
    <<: *entry
    rooms: *rooms
    mode: *mode
    front:
      default: false
      selector:
        boolean:

dequeue:
  fields:
    <<: *entry
    rooms: *rooms
    skip_today:
      default: true
      selector:
        boolean:

move:
  fields:
    <<: *entry
    room: *room
    position:
      required: true
      default: 0
      selector:
        number:
          min: 0
          max: 30
          mode: box

clear_queue:
  fields:
    <<: *entry

enqueue_due:
  fields:
    <<: *entry

start:
  fields:
    <<: *entry
    force:
      default: true
      selector:
        boolean:

stop:
  fields:
    <<: *entry
    return_home:
      default: true
      selector:
        boolean:

clean_now:
  fields:
    <<: *entry
    rooms: *rooms
    mode:
      default: vacuum_mop
      selector:
        select:
          translation_key: mode
          options:
            - vacuum
            - vacuum_mop
            - mop
            - mopping_after_sweeping

pause_room:
  fields:
    <<: *entry
    rooms: *rooms
    until:
      selector:
        datetime:
    days:
      selector:
        number:
          min: 1
          max: 60
          mode: box

resume_room:
  fields:
    <<: *entry
    rooms: *rooms

set_plan:
  fields:
    <<: *entry
    room: *room
    mode:
      selector:
        select:
          translation_key: plan_mode
          options:
            - "off"
            - vacuum
            - vacuum_mop
            - mop
            - mopping_after_sweeping
    interval:
      selector:
        number:
          min: 1
          max: 30
          unit_of_measurement: d
          mode: box

set_last_cleaned:
  fields:
    <<: *entry
    rooms: *rooms
    timestamp:
      selector:
        datetime:

skip_today:
  fields:
    <<: *entry
    skip:
      default: true
      selector:
        boolean:
